<style>

    if(ok&&to!==from){const a=S.links.filter((_,k)=>k!==from),m=S.links[from];a.splice(to,0,m);S={...S,links:a};paint();say(`${m.title} movida para a posição ${to+1} de ${a.length}.`);
      if(!reduced())list.querySelector(`[data-id="${m.id}"]`)?.animate([{transform:'scale(1.02)'},{transform:'none'}],{duration:240,easing:'cubic-bezier(.34,1.4,.64,1)'});save()}};
  const up=()=>end(true),cx=()=>end(false);
  g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',cx)}
async function act(l,k){
  try{S=await api(`/links/${l.id}/${k}`,{m:'POST'});paint();toast(k==='refresh'?'Prévia atualizada.':S.links.find(x=>x.id===l.id).visible?'Faixa visível no site.':'Faixa oculta do site.')}
  catch(e){e.e==='exp'?fail(e):toast(k==='refresh'?'Falha ao atualizar a prévia. A faixa anterior foi mantida.':msg(e),1)}}
function del(l){
  const d=h('dialog',{'aria-labelledby':'dt'},h('h2',{id:'dt'},'Excluir esta faixa?'),h('p',{},`“${l.title}” será removida do site. Essa ação não pode ser desfeita.`),
    h('div',{class:'row'},h('button',{class:'b d',onclick:async()=>{d.close();try{S=await api('/links/'+l.id,{m:'DELETE'});paint();toast('Faixa excluída.')}catch(e){e.e==='exp'?fail(e):toast(msg(e),1)}}},'Excluir'),h('button',{class:'b',autofocus:true,onclick:()=>d.close()},'Cancelar')));
  d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal()}
route();
